<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Point, Pixel and Voxel</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:Helvetica,Arial,sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:min(100%,530px)}.label{color:#999;font-size:13px;letter-spacing:.08em;line-height:1.6}h1{font-weight:500;font-size:clamp(44px,7vw,76px);letter-spacing:-.055em;line-height:1.04;margin:32px 0}h1 span{color:#164bff}label{display:block;font-size:15px;margin:0 0 10px}input,button{border-radius:0;font:inherit;padding:16px;border:1px solid #ffffff50}input{width:100%;background:#ffffff08;color:white;font-size:18px}input:focus{outline:2px solid #164bff;outline-offset:3px}button{margin-top:16px;width:100%;background:#164bff;color:white;border-color:#164bff;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px;color:#ccc;line-height:1.5;font-size:14px}footer{margin-top:36px;color:#999;font-size:14px}
</style></head><body><main><p class="label">INTERACTIVE ART MEDIA INSTALLATION CLASS</p><h1>Point,<br><span>Pixel</span> and Voxel</h1><form id="unlock"><label for="password">Class password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Open lecture →</button><p id="status" role="status" aria-live="polite"></p></form><footer>Weidi Zhang, PhD · Arizona State University</footer></main><script>
(()=>{
const form=document.getElementById('unlock'),field=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status');
const storageKey='lecture-key:'+location.pathname;
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let payload;
async function getPayload(){if(!payload){const r=await fetch('./lecture.bin',{cache:'no-cache'});if(!r.ok)throw new Error('load');payload=new Uint8Array(await r.arrayBuffer())}return payload}
async function open(key,bytes){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));try{sessionStorage.setItem(storageKey,btoa(String.fromCharCode(...raw)))}catch{}field.value='';document.open();document.write(new TextDecoder().decode(plain));document.close()}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Opening lecture…';let bytes;try{bytes=await getPayload()}catch{status.textContent='Unable to load the lecture. Please check your connection and try again.';button.disabled=false;return}try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(0,16),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);await open(key,bytes)}catch{status.textContent='Incorrect password. Please try again.';button.disabled=false;field.focus()}});
async function resume(){let saved;try{saved=sessionStorage.getItem(storageKey)}catch{}if(!saved)return;button.disabled=true;status.textContent='Opening lecture…';try{const key=await crypto.subtle.importKey('raw',decode(saved),'AES-GCM',true,['decrypt']);await open(key,await getPayload())}catch{try{sessionStorage.removeItem(storageKey)}catch{}button.disabled=false;status.textContent='Please enter the class password.'}}
void resume();
})();
</script></body></html>
